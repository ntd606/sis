<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Add Student</title>
  <style>body{font-family:Arial;margin:50px;} form{width:300px;} div{margin-bottom:10px;} label{display:block;} input{width:100%;padding:8px;}</style>
</head>
<body>
<h2>Add New Student</h2>
<form th:action="@{/students/save}" th:object="${student}" method="post">
  <div><label>Student Code:</label><input type="text" th:field="*{studentCode}" required/></div>
  <div><label>Full Name:</label><input type="text" th:field="*{fullName}" required/></div>
  <div><label>Address:</label><input type="text" th:field="*{address}"/></div>
  <button type="submit">Save Student</button>
</form>
</body>
</html>
